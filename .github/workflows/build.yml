name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
      - run: flutter create . --platforms=android --overwrite
      - run: flutter pub add webview_flutter
      - run: printf "import 'package:flutter/material.dart';\nimport 'package:webview_flutter/webview_flutter.dart';\nvoid main(){runApp(MaterialApp(debugShowCheckedModeBanner:false,home:Scaffold(appBar:AppBar(title:Text('نور مبين'),backgroundColor:Colors.green,centerTitle:true),body:MyWeb())));}\nclass MyWeb extends StatefulWidget{const MyWeb({super.key});@override State<MyWeb> createState()=>_MyWebState();}\nclass _MyWebState extends State<MyWeb>{late final c;\n@override void initState(){super.initState();c=WebViewController()..setJavaScriptMode(JavaScriptMode.unrestricted)..loadRequest(Uri.parse('https://quran.com'));} \n@override Widget build(BuildContext context){return WebViewWidget(controller:c);}}" > lib/main.dart
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Noor-Mubeen-APK
          path: build/app/outputs/flutter-apk/app-release.apk
